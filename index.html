<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Bookmark</title>
  <style>
    body {
      font-family: Arial, "Meiryo", sans-serif;
      max-width: 800px;
      margin: 80px auto;
      padding: 0 24px;
      line-height: 1.8;
      color: #222;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 8px;
    }
    .sub {
      color: #666;
      font-size: 18px;
    }
    .box {
      margin-top: 40px;
      padding: 24px;
      background: #f5f5f5;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<h1>Video Bookmark</h1>

<p class="sub">
動画を切らずに、好きな場面を「しおり」として保存。
</p>

<div class="box">
  <h2>Video Bookmark について</h2>

  <p>
    Video Bookmark は、動画ファイルそのものを編集することなく、
    好きな場面の開始位置と終了位置を「しおり」として保存できる
    Windows向けアプリケーションです。
  </p>

  <p>
    無料でお試しいただける体験版を準備中です。
  </p>

  <p>
    Windows / 日本語・English
  </p>
</div>

<p style="margin-top:40px;">
  Developer: Takeshi Mikami
</p>

</body>
</html>
